name: Read-only content audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
      MICROCMS_READ_API_KEY: ${{ secrets.MICROCMS_READ_API_KEY }}
      MICROCMS_ARTICLE_ENDPOINT: ${{ vars.MICROCMS_ARTICLE_ENDPOINT || 'articles' }}
      MICROCMS_FRANCHISE_ENDPOINT: ${{ vars.MICROCMS_FRANCHISE_ENDPOINT || 'franchise' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: audit
        run: npm run audit
        continue-on-error: true
      - run: npm run agent:input
      - run: npm run agent:plan
      - name: Fail after generating the remediation proposal
        if: steps.audit.outcome == 'failure'
        run: exit 1
