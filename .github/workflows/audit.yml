name: Read-only content audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
      MICROCMS_READ_API_KEY: ${{ secrets.MICROCMS_READ_API_KEY }}
      MICROCMS_ARTICLE_ENDPOINT: ${{ vars.MICROCMS_ARTICLE_ENDPOINT || 'articles' }}
      MICROCMS_FRANCHISE_ENDPOINT: ${{ vars.MICROCMS_FRANCHISE_ENDPOINT || 'franchise' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: audit
        run: npm run audit
        continue-on-error: true
      - run: npm run agent:input
      - run: npm run agent:plan
      - name: Fail after generating the remediation proposal
        if: steps.audit.outcome == 'failure'
        run: exit 1
